<!doctype html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — redesign concept</title>
<style>
/* ============================================================
   PORTFOLIO — redesign concept
   Same data, same engine, different information design.
   Tokens first; every value below is used, none are decorative.
   ============================================================ */

:root {
  color-scheme: light;
  --paper:      #FBFAF8;
  --surface:    #FFFFFF;
  --surface-2:  #F4F2EE;
  --rail:       #F6F4F0;
  --ink:        #14181D;
  --ink-2:      #5C6672;
  --ink-3:      #939CA7;
  --line:       #E9E6E0;
  --line-2:     #D6D2CA;
  --pos:        #1668C4;
  --pos-soft:   #E4EDF9;
  --neg:        #C0303D;
  --neg-soft:   #FAE7E8;
  --accent:     #B8532F;
  /* The logo's own two values. Deliberately separate from --accent: white on
     #D9531E measures 4.03:1, under the 4.5:1 floor, where --accent measures
     4.87:1 — and --accent is a filled button background. Swapping them is not
     a rename, it is a measured change to a validated palette. */
  --brand-ink:    #16213E;
  --brand-accent: #D9531E;
  --s1: #4E77CE; --s2: #7A52A8; --s3: #0F8288; --s4: #AC4519;
  --s5: #9E8018; --s6: #547C41; --s7: #99376A; --s8: #8B8981;

  --r:   10px;
  --r-s: 6px;
  --hair: 1px;

  --f: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fn: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --paper:      #0D1116;
  --surface:    #141920;
  --surface-2:  #1B222B;
  --rail:       #10151B;
  --ink:        #E8EDF3;
  --ink-2:      #98A3B0;
  --ink-3:      #6B7683;
  --line:       #232B35;
  --line-2:     #333D49;
  --pos:        #5FA3F0;
  --pos-soft:   #16283D;
  --neg:        #EF737E;
  --neg-soft:   #341C21;
  --accent:     #E08355;
  --brand-ink:    #E8EDF5;
  --brand-accent: #F97038;
  --s1: #4A86DE; --s2: #A383D0; --s3: #41BABC; --s4: #DA7E4B;
  --s5: #D0AC3E; --s6: #7FAE5C; --s7: #F086B9; --s8: #7B8798;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: var(--f);
  font-size: 0.9375rem;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* Numbers are always tabular. A column of figures that jitters is unreadable. */
.n, td.n, .hero-value, .stat-v, .delta { font-variant-numeric: tabular-nums; }

/* ---------- app shell ---------------------------------------------------- */

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; background: var(--rail); }
main { background: var(--paper); }

.rail {
  background: var(--rail);
  border-right: var(--hair) solid var(--line);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  padding: 20px 12px 12px;
}

.brand { padding: 2px 10px 22px; }
/* The lockup: mark plus wordmark, the wordmark in the UI's own stack with the
   brand's tracking. Ink rides currentColor so there is no second palette and
   no theme branch in JavaScript. */
.lockup { display: flex; align-items: center; gap: 9px; color: var(--brand-ink); }
.lockup .mark { display: block; flex: none; }
.wordmark {
  font-size: 0.9375rem; font-weight: 500; letter-spacing: 0.16em;
  color: var(--brand-ink); line-height: 1;
}
.brand-sub { font-size: 0.6875rem; color: var(--ink-3); margin: 5px 0 0 2px; }

nav.sections { display: flex; flex-direction: column; gap: 1px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-s);
  font-size: 0.875rem; font-weight: 500; color: var(--ink-2);
  background: none; border: 0; cursor: pointer; text-align: left; width: 100%;
  font-family: inherit;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 580;
  box-shadow: 0 0 0 var(--hair) var(--line), 0 1px 2px rgba(0,0,0,.04); }
.nav-item .ico { width: 15px; height: 15px; flex: none; opacity: .75; }
.nav-item[aria-current="true"] .ico { opacity: 1; color: var(--accent); }
.nav-item .tail { margin-left: auto; font-size: 0.6875rem; color: var(--ink-3); }
.nav-item .tail.warn {
  background: var(--neg-soft); color: var(--neg); font-weight: 600;
  border-radius: 99px; padding: 1px 6px;
}

.rail-foot { margin-top: auto; padding: 12px 10px 0; border-top: var(--hair) solid var(--line); }
.sync-line { display: flex; align-items: center; gap: 7px; font-size: 0.75rem; color: var(--ink-2); }
.dot { width: 6px; height: 6px; border-radius: 99px; background: var(--pos); flex: none; }
.sync-when { font-size: 0.6875rem; color: var(--ink-3); margin: 3px 0 10px 13px; }

.btn {
  font-family: inherit; font-size: 0.8125rem; font-weight: 550;
  padding: 7px 12px; border-radius: var(--r-s); cursor: pointer;
  border: var(--hair) solid var(--line-2); background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); width: 100%; justify-content: center; }
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-icon { padding: 7px; }

/* ---------- overflow menu ------------------------------------------------ */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
  background: var(--surface); border: var(--hair) solid var(--line);
  border-radius: var(--r); box-shadow: 0 12px 32px rgba(20,25,30,.13), 0 2px 6px rgba(20,25,30,.06);
  padding: 6px; min-width: 232px;
}
.menu-label { font-size: 0.6875rem; color: var(--ink-3); padding: 7px 10px 4px; letter-spacing: .04em; text-transform: uppercase; }
.menu button {
  display: flex; width: 100%; align-items: center; gap: 9px; text-align: left;
  font-family: inherit; font-size: 0.8125rem; color: var(--ink);
  background: none; border: 0; padding: 7px 10px; border-radius: var(--r-s); cursor: pointer;
}
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--neg); }
.menu hr { border: 0; border-top: var(--hair) solid var(--line); margin: 5px 0; }
.seg-inline { display: flex; gap: 2px; padding: 4px 10px 8px; }

/* ---------- main --------------------------------------------------------- */

main { min-width: 0; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 14px clamp(16px, 2.4vw, 34px);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: var(--hair) solid var(--line);
}
.topbar h1 { font-size: 1.0625rem; font-weight: 620; margin: 0; letter-spacing: -0.012em; }
.topbar .spacer { margin-left: auto; }
.crumb { font-size: 0.75rem; color: var(--ink-3); }

.page { padding: clamp(18px, 2.4vw, 30px) clamp(16px, 2.4vw, 34px) 64px; max-width: 1360px; }

/* ---------- hero --------------------------------------------------------- */

.hero {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: clamp(20px, 3vw, 56px);
  align-items: end; padding-bottom: 22px; margin-bottom: 22px;
  border-bottom: var(--hair) solid var(--line);
}
@media (max-width: 62rem) { .hero { grid-template-columns: 1fr; align-items: start; } }

.eyebrow {
  font-size: 0.6875rem; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3);
}
.hero-value {
  font-size: clamp(2.375rem, 1.4rem + 3.6vw, 3.5rem);
  font-weight: 630; letter-spacing: -0.035em; line-height: 1.02;
  margin: 8px 0 0;
}
.hero-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; margin-top: 12px; font-size: 0.875rem; color: var(--ink-2); }
.delta { font-weight: 580; }
.delta.up { color: var(--pos); }
.delta.down { color: var(--neg); }
.sep { color: var(--line-2); }

/* Supporting figures read as a list of facts, not as seven rival headlines. */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 2px 28px; }
@media (max-width: 62rem) { .facts { grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); } }
.fact { padding: 2px 0; }
.fact-k { font-size: 0.75rem; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.fact-v { font-size: 1.0625rem; font-weight: 580; letter-spacing: -0.015em; font-variant-numeric: tabular-nums; margin-top: 1px; }
.fact-n { font-size: 0.6875rem; color: var(--ink-3); }

/* The explainer is a disclosure, not a permanent paragraph. */
.q {
  width: 14px; height: 14px; border-radius: 99px; flex: none;
  border: var(--hair) solid var(--line-2); background: none; color: var(--ink-3);
  font-size: 9px; font-family: inherit; line-height: 1; cursor: help; padding: 0;
  display: inline-grid; place-items: center;
}
.q:hover { border-color: var(--ink-3); color: var(--ink-2); }
.tip {
  position: fixed; z-index: 60; max-width: 290px;
  background: var(--ink); color: var(--paper);
  font-size: 0.75rem; line-height: 1.45; padding: 9px 11px; border-radius: var(--r-s);
  box-shadow: 0 8px 24px rgba(0,0,0,.2); pointer-events: none;
}

/* ---------- panels ------------------------------------------------------- */

.panel { background: var(--surface); border: var(--hair) solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.panel-head {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: var(--hair) solid var(--line);
}
.panel-head h2 { font-size: 0.9375rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.panel-head .sub { font-size: 0.8125rem; color: var(--ink-3); }
.panel-head .spacer { margin-left: auto; }
.panel-body { padding: 16px 18px 18px; }
.panel-body.flush { padding: 0; }
.panel-foot { padding: 11px 18px; border-top: var(--hair) solid var(--line); font-size: 0.75rem; color: var(--ink-3); }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 68rem) { .cols { grid-template-columns: 1fr; } }
.cols-3-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
@media (max-width: 68rem) { .cols-3-2 { grid-template-columns: 1fr; } }

/* ---------- segmented control -------------------------------------------- */

.seg { display: inline-flex; gap: 1px; background: var(--surface-2); border-radius: 7px; padding: 2px; }
.seg button {
  font-family: inherit; font-size: 0.75rem; font-weight: 550; color: var(--ink-2);
  background: none; border: 0; padding: 4px 10px; border-radius: 5px; cursor: pointer;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 var(--hair) var(--line), 0 1px 2px rgba(0,0,0,.05);
}
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--pos); }

/* ---------- charts ------------------------------------------------------- */

.chart-host { width: 100%; overflow: hidden; }
.chart { display: block; max-width: 100%; }
.chart text { font-family: var(--f); font-variant-numeric: tabular-nums; }
.ax { fill: var(--ink-3); font-size: 10.5px; }
.gl { stroke: var(--line); stroke-width: 1; }
.zl { stroke: var(--line-2); stroke-width: 1; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 0.75rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

/* ---------- tables ------------------------------------------------------- */

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
thead th {
  text-align: left; font-weight: 550; color: var(--ink-3); font-size: 0.75rem;
  padding: 9px 12px; border-bottom: var(--hair) solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--surface);
}
thead th.n, tbody td.n { text-align: right; }
tbody td { padding: 9px 12px; border-bottom: var(--hair) solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
td.name { font-weight: 520; }
td .ticker { color: var(--ink-3); font-weight: 400; margin-left: 6px; font-size: 0.75rem; }
.up { color: var(--pos); }
.down { color: var(--neg); }
.muted { color: var(--ink-3); }

/* Share is a quantity: draw it, don't only print it. */
.bar-cell { display: flex; align-items: center; gap: 9px; justify-content: flex-end; }
.bar-track { display: block; width: 62px; height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex: none; }
.bar-fill { display: block; height: 100%; border-radius: 99px; }
.dotm { width: 7px; height: 7px; border-radius: 2px; flex: none; display: inline-block; margin-right: 8px; vertical-align: 0.5px; }

.pill { font-size: 0.6875rem; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }

/* ---------- composition strip -------------------------------------------- */
.strip { display: flex; height: 30px; border-radius: 6px; overflow: hidden; gap: 1px; }
.strip > div { position: relative; }
.strip > div span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 0.6875rem; font-weight: 600; color: #fff; letter-spacing: .01em;
}

/* ---------- heatmap ------------------------------------------------------ */
table.matrix td, table.matrix th { padding: 6px 7px; font-size: 0.75rem; text-align: right; border: 0; }
table.matrix thead th { color: var(--ink-3); font-weight: 550; }
table.matrix tbody th { text-align: left; color: var(--ink-2); font-weight: 550; padding-left: 12px; }
table.matrix tbody tr:hover td { background: none; }
table.matrix td b { font-weight: 500; }
.scale-row { display: flex; align-items: center; gap: 9px; font-size: 0.6875rem; color: var(--ink-3); margin-top: 12px; padding-left: 12px; }
.scale-bar { width: 130px; height: 7px; border-radius: 99px;
  background: linear-gradient(90deg, var(--neg), var(--neg-soft), var(--surface-2), var(--pos-soft), var(--pos)); }

/* ---------- notices ------------------------------------------------------ */
.notice { display: flex; gap: 12px; padding: 13px 0; border-bottom: var(--hair) solid var(--line); }
.notice:last-child { border-bottom: 0; }
.notice-ico { width: 17px; height: 17px; flex: none; margin-top: 2px; }
.notice h3 { font-size: 0.875rem; font-weight: 580; margin: 0 0 2px; }
.notice p { margin: 0; font-size: 0.8125rem; color: var(--ink-2); }
.notice .code { font-family: var(--fn); font-size: 0.6875rem; color: var(--ink-3); }

/* ---------- caveat band -------------------------------------------------- */
.caveat {
  border-left: 3px solid var(--accent); background: var(--surface-2);
  padding: 14px 16px; border-radius: 0 var(--r-s) var(--r-s) 0; margin-bottom: 16px;
}
.caveat h3 { margin: 0 0 4px; font-size: 0.875rem; font-weight: 600; }
.caveat p { margin: 0; font-size: 0.8125rem; color: var(--ink-2); max-width: 68ch; }

.field { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--ink-2); }
.field input[type=number] {
  font-family: inherit; font-size: 0.8125rem; font-variant-numeric: tabular-nums;
  width: 6.5rem; padding: 5px 8px; border-radius: var(--r-s);
  border: var(--hair) solid var(--line-2); background: var(--surface); color: var(--ink);
}

.empty { padding: 34px 18px; text-align: center; color: var(--ink-3); font-size: 0.8125rem; line-height: 1.6; }

/* ---------- the rest of the figures -------------------------------------- */
.figures {
  background: var(--surface); border: var(--hair) solid var(--line);
  border-radius: var(--r); margin-bottom: 16px;
}
.figures > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 12px 18px; font-size: 0.8125rem; font-weight: 550; color: var(--ink-2);
}
.figures > summary::-webkit-details-marker { display: none; }
.figures > summary:hover { color: var(--ink); }
.figures[open] > summary { border-bottom: var(--hair) solid var(--line); }
.figures .chev { display: inline-flex; transition: transform .15s; }
.figures[open] .chev { transform: rotate(180deg); }
.fig-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px 26px; padding: 16px 18px 18px;
}
.fig-k { font-size: 0.75rem; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.fig-v { font-size: 1rem; font-weight: 570; letter-spacing: -0.012em; font-variant-numeric: tabular-nums; margin-top: 1px; }
.fig-n { font-size: 0.6875rem; color: var(--ink-3); margin-top: 1px; }

/* ---------- hidden amounts ----------------------------------------------- */
.mask-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--line-2); }
.mask-note {
  display: none; align-items: center; gap: 6px;
  font-size: 0.75rem; color: var(--ink-3);
}
body.is-masked .mask-note { display: inline-flex; }

/* ---------- share modal --------------------------------------------------- */
.share-btn { color: var(--ink-3); }
.share-btn:hover { color: var(--ink); }
.hero-value .share-btn { vertical-align: 0.35em; margin-left: 6px; }

.modal-back {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  background: rgba(12,16,20,.42); backdrop-filter: blur(3px); padding: 20px;
}
.modal {
  background: var(--surface); border: var(--hair) solid var(--line); border-radius: 14px;
  box-shadow: 0 24px 70px rgba(0,0,0,.28); width: min(940px, 100%); max-height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: var(--hair) solid var(--line); }
.modal-head h2 { font-size: 0.9375rem; font-weight: 600; margin: 0; }
.modal-head .btn { margin-left: auto; }
.modal-body { display: grid; grid-template-columns: 1fr 320px; gap: 0; overflow: auto; }
@media (max-width: 52rem) { .modal-body { grid-template-columns: 1fr; } }
.preview {
  padding: 22px; background: var(--surface-2); display: grid; place-items: center;
  border-right: var(--hair) solid var(--line);
}
.preview canvas { max-width: 100%; max-height: 52vh; border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.14); }
.controls-col { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.ctl { display: block; }
.ctl > span { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: var(--ink-3); margin-bottom: 6px; }
.seg.wrap { flex-wrap: wrap; }
.ctl input[type=text] {
  width: 100%; font-family: inherit; font-size: 0.8125rem; padding: 7px 10px;
  border-radius: var(--r-s); border: var(--hair) solid var(--line-2);
  background: var(--surface); color: var(--ink);
}
.src-chip {
  font-size: 0.625rem; text-transform: none; letter-spacing: 0;
  background: var(--surface-2); color: var(--ink-2);
  border-radius: 99px; padding: 2px 7px; margin-left: auto;
}
.ident-preview {
  margin-top: 7px; font-size: 0.8125rem; font-weight: 550; color: var(--ink);
  padding: 7px 10px; border-radius: var(--r-s); background: var(--surface-2);
}
.ident-preview .muted { font-weight: 400; }
.warn-line { margin: -6px 0 0; font-size: 0.75rem; color: var(--accent); line-height: 1.45; }
.fields { border-top: var(--hair) solid var(--line); padding-top: 12px; }
.fields-k { font-size: 0.6875rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
.fields .pill { margin: 0 4px 4px 0; display: inline-block; font-family: var(--fn); font-size: 0.6875rem; }
.fields p { font-size: 0.75rem; color: var(--ink-3); margin: 9px 0 0; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; margin-top: auto; }
.modal-actions .btn { flex: 1; justify-content: center; }
.copy-note { font-size: 0.75rem; color: var(--ink-3); min-height: 1em; }

.eyebrow .win {
  font-weight: 500; letter-spacing: 0; text-transform: none;
  color: var(--ink-3); margin-left: 6px;
}
td.out b, td.out { opacity: .34; }
/* dragging a window out of the chart */
.brush { position: relative; cursor: crosshair; touch-action: none; }
.brush-box {
  position: absolute; top: 0; bottom: 22px; z-index: 2; pointer-events: none;
  background: color-mix(in srgb, var(--pos) 12%, transparent);
  border-left: 1px solid var(--pos); border-right: 1px solid var(--pos);
}
.brush-hint { font-size: 0.6875rem; color: var(--ink-3); margin: 10px 0 0; }
.zoom-state {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface-2); border-radius: var(--r-s);
  padding: 8px 10px 8px 12px; margin-bottom: 12px; font-size: 0.8125rem; color: var(--ink-2);
}
.zoom-state b { color: var(--ink); font-variant-numeric: tabular-nums; }
.zoom-state .btn { margin-left: auto; }

td.pick, th.pick-col { cursor: pointer; }

/** Monthly result, index-aligned with LBL (MF[i] is the month ending LBL[i]). */
const MF = (() => {
  const out = [0];
  for (const y of Object.keys(MONTHS)) for (const v of MONTHS[y]) out.push(v);

/** Net external cashflow per month — real, straight out of PAID. */
const DEP = VAL.map((_,i) => i ? PAID[i]-PAID[i-1] : 0);

const mulberry = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s>>>15, 1|s);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };

/** Dividend per month, generated but pinned to the real per-year totals. */
const DIVM = (() => {
  const rnd = mulberry(777), out = new Array(N).fill(0), byYear = {};
  for (let i=1;i<N;i++) (byYear[LBL[i].slice(0,4)] ||= []).push(i);

  }
  return out;
})();

/** Per-holding value history. Generated, but it sums to VAL at every point

  const walks = HOLD.map(()=>{ let v=1; return Array.from({length:N},()=>{ v *= 0.94+rnd()*0.13; v = Math.max(.5,Math.min(1.9,v)); return v; }); });

  for (let i=1;i<N;i++) {
    const t = Math.pow(i/(N-1), 2.2), w = [];
    let sum = 0;
    HOLD.forEach((h,k)=>{
      const on = i >= h.from;
      const v = on ? h.sh*walks[k][i]*(1-t) + h.sh*t : 0;
      w[k]=v; sum+=v;
    });
    HOLD.forEach((h,k)=> out[k][i] = sum ? VAL[i]*w[k]/sum : 0);

function rangeStart(){
  if (RANGE === 'ALL') return null;

    const base = VAL[i-1] > 1 ? VAL[i-1] : (PAID[i] || 0);
    if (base > 1) twr *= 1 + MF[i]/base;
    if (DEP[i] > 0) dep += DEP[i]; else wd += DEP[i];
  }
  let peak=-Infinity, pk=a, dd=0, ddPct=0, ddA=null, ddB=null;
  for (let i=a;i<=b;i++){
    if (VAL[i] > peak) { peak = VAL[i]; pk = i; }
    const d = VAL[i]-peak;
    if (d < dd && peak > 1) { dd=d; ddPct=d/peak*100; ddA=pk; ddB=i; }
  }
  return {a,b, v0:VAL[a], v1:VAL[b], res, twr:(twr-1)*100,
          flow:PAID[b]-PAID[a], div, dep, wd, dd, ddPct, ddA, ddB,
          points:b-a+1, from:LBL[a], to:LBL[b]};
}

const sl = arr => { const {a,b}=win(); return arr.slice(a,b+1); };
/* The anchor at index 0 is a synthetic "before anything existed" point. It is
   what makes the all-time delta real, but it is not a measurement, so it is
   never drawn. */
const slc = arr => { const {a,b}=win(); return arr.slice(Math.max(a,1), b+1); };
const windowLabel = () => {
  const {a,b} = win();
  if (!ZOOM && RANGE==='ALL') return `${dLabel(LBL[1])} – ${dLabel(TODAY)}`;
  return `${dFull(LBL[Math.max(a,1)])} – ${dFull(LBL[b])}`;
};

/** Deposit / withdrawal triangles, positioned inside the current window. */
function flowMarkers(){
  const {a,b}=win(), s=Math.max(a,1), out=[];
  for (let i=s;i<=b;i++) if (Math.abs(DEP[i])>0.5) out.push({i:i-s, dir:DEP[i]>0?1:-1});
  return out;
}

/** Too few points to draw honestly. Monthly source data cannot show a week. */
function thin(){ return win().b - win().a < 2; }
const thinNote = `<div class="empty">Deze periode bevat te weinig meetpunten om een lijn van te maken.<br>
  De bron is een dagwaarde per maandeinde; kies een langere periode.</div>`;

/* =====================================================================
   SVG CHART PRIMITIVES
   Drawn at measured pixel width; a stretched viewBox distorts axis type.
   ===================================================================== */

const CHARTS = [];
function chartHost(kind,cfg){ const i=CHARTS.push({kind,cfg})-1;
  return `<div class="chart-host" data-chart="${i}" style="height:${cfg.h||300}px"></div>`; }
function drawCharts(){
  document.querySelectorAll('.chart-host').forEach(el=>{
    const c = CHARTS[+el.dataset.chart]; if(!c) return;
    const W = Math.max(320, el.clientWidth);
    el.innerHTML = c.kind==='line' ? buildLine(c.cfg,W) : c.kind==='stack' ? buildStack(c.cfg,W) : c.kind==='hbar' ? buildHBar(c.cfg,W) : buildBar(c.cfg,W);
  });
}
addEventListener('resize', ()=>{ clearTimeout(window.__rt); window.__rt=setTimeout(drawCharts,120); });

const lineChart  = cfg => chartHost('line',cfg);
const hbarChart  = cfg => chartHost('hbar',cfg);
const barChart   = cfg => chartHost('bar',cfg);
const stackChart = cfg => chartHost('stack',cfg);

function niceTicks(min,max,n=4){
  const span = max-min || 1, raw = span/n, mag = Math.pow(10,Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>raw<=s) || 10*mag;
  const out=[]; let t=Math.ceil(min/step)*step;
  while (t <= max+step*0.001){ out.push(+t.toFixed(6)); t+=step; }
  return out;
}

function axis(g, {labels, W, h, PL, PR, PB, X}){
  const step = Math.ceil(labels.length / Math.max(2, Math.floor(W/130)));
  let s = '';
  for (let i=0;i<labels.length;i+=step){
    if (X(i) > W-PR-28) continue;
    s += `<text class="ax" x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle">${dLabel(labels[i])}</text>`;
  }
  return g+s;
}

/* With amounts hidden the y axis goes too: gridlines keep the shape legible,
   labels would hand back the level the mask just removed. */
const yPad = () => MASKED ? 18 : 64;

function buildLine({series,labels,h=300,area=true,markers=null,fmt=kEur,zero=true},W){
  const PL=yPad(),PR=16,PT=12,PB=26;
  const all = series.flatMap(s=>s.data).filter(v=>v!=null);
  /* A three-month window on a six-figure account, drawn from zero, is a flat
     line: the axis spends 90% of its height on ground the window never
     touches. So a window that does not contain the account's own start gets a
     baseline near its own low — and the panel says so underneath, because a
     chart that does not start at zero and does not admit it is the oldest
     trick in the book. */
  let lo, hi = Math.max(...all);
  if (zero) lo = Math.min(0,...all);
  else { const min = Math.min(...all); const pad = (hi-min || hi*0.05)*0.35; lo = Math.max(0, min-pad); }
  const ticks = niceTicks(lo,hi,4);
  lo=Math.min(lo,ticks[0]); hi=Math.max(hi,ticks[ticks.length-1]);
  const X = i => PL + i*(W-PL-PR)/Math.max(1,labels.length-1);
  const Y = v => PT + (hi-v)*(h-PT-PB)/(hi-lo || 1);

  let g = ticks.map(t=>`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
    <text class="ax" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('');
  g = axis(g,{labels,W,h,PL,PR,PB,X});

  let paths='';
  series.forEach((s,si)=>{
    const d = s.data.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    if (area && si===0) paths += `<defs><linearGradient id="ag${si}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${s.color}" stop-opacity=".20"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/>
      </linearGradient></defs><path d="${d} L${X(s.data.length-1).toFixed(1)} ${Y(lo).toFixed(1)} L${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z" fill="url(#ag${si})"/>`;
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
  });

  let mk='';
  if (markers) markers.forEach(m=>{ const x=X(m.i), y=Y(lo);
    mk += m.dir>0 ? `<path d="M${x-3.5} ${y+7} L${x+3.5} ${y+7} L${x} ${y+1.5} Z" fill="var(--pos)" opacity=".8"/>`
                  : `<path d="M${x-3.5} ${y+1.5} L${x+3.5} ${y+1.5} L${x} ${y+7} Z" fill="var(--neg)" opacity=".8"/>`; });

  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img">
    ${g}${paths}<line class="zl" x1="${PL}" x2="${W-PR}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}"/>${mk}</svg>`;
}

function buildBar({data,labels,h=260,fmt=kEur},W){
  const neg = data.some(v=>v!=null && v<0);
  const PL=yPad(),PR=16,PT=12,PB=neg?34:26;
  const vals = data.filter(v=>v!=null);
  const ticks = niceTicks(Math.min(0,...vals), Math.max(0,...vals), 4);
  const lo=ticks[0], hi=ticks[ticks.length-1];
  const bw=(W-PL-PR)/data.length;
  const X = i => PL + i*bw;
  const Y = v => PT + (hi-v)*(h-PT-PB)/(hi-lo || 1);
  let g = ticks.map(t=>`<line class="${t===0?'zl':'gl'}" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
    <text class="ax" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('');
  g = axis(g,{labels,W,h,PL,PR,PB,X:i=>X(i)+bw/2});
  const bars = data.map((v,i)=>{ if(v==null) return '';
    const y0=Y(0), y1=Y(v);
    return `<rect x="${(X(i)+bw*0.18).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${Math.max(1,bw*0.64).toFixed(1)}"
      height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" rx="1" fill="${v<0?'var(--neg)':'var(--pos)'}"/>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img">${g}${bars}</svg>`;
}

/** Ranked horizontal bars around a zero line — the shape of "what moved". */
function buildHBar({rows,h,fmt=kEur},W){
  const PL=MASKED?96:104, PR=16, PT=6, PB=22;
  const vs = rows.map(r=>r.v);
  const ticks = niceTicks(Math.min(0,...vs), Math.max(0,...vs), 4);
  /* Extend past the ticks if a bar is longer than the last one, or the longest
     bar silently runs off the plot — which is how a chart ends up lying. */
  const lo = Math.min(ticks[0], ...vs), hi = Math.max(ticks[ticks.length-1], ...vs);
  const X = v => PL + (v-lo)*(W-PL-PR)/(hi-lo);
  const bh = (h-PT-PB)/rows.length;
  let g = ticks.map(t=>`<line class="${t===0?'zl':'gl'}" x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="${PT}" y2="${h-PB}"/>
    <text class="ax" x="${X(t).toFixed(1)}" y="${h-6}" text-anchor="middle">${fmt(t)}</text>`).join('');
  const bars = rows.map((r,i)=>{
    const y = PT + i*bh, x0 = X(0), x1 = X(r.v);
    return `<text class="ax" x="${PL-10}" y="${(y+bh/2+3.5).toFixed(1)}" text-anchor="end">${esc(r.k)}</text>
      <rect x="${Math.min(x0,x1).toFixed(1)}" y="${(y+bh*0.2).toFixed(1)}" width="${Math.max(1,Math.abs(x1-x0)).toFixed(1)}"
        height="${(bh*0.6).toFixed(1)}" rx="2" fill="${r.v<0?'var(--neg)':'var(--pos)'}"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img">${g}${bars}</svg>`;
}

function buildStack({series,labels,h=300,fmt=kEur},W){
  const PL=yPad(),PR=16,PT=12,PB=26;
  const totals = labels.map((_,i)=> series.reduce((a,s)=>a+s.data[i],0));
  const ticks = niceTicks(0, Math.max(...totals), 4);
  const hi = ticks[ticks.length-1];
  const X = i => PL + i*(W-PL-PR)/Math.max(1,labels.length-1);
  const Y = v => PT + (hi-v)*(h-PT-PB)/(hi || 1);
  let g = ticks.map(t=>`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
    <text class="ax" x="${PL-8}" y="${(Y(t)+3.5).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('');
  g = axis(g,{labels,W,h,PL,PR,PB,X});
  let acc = labels.map(()=>0), bands='';
  series.forEach(s=>{
    const top = acc.map((v,i)=>v+s.data[i]);
    const up = top.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const dn = acc.map((v,i)=>`L${X(acc.length-1-i).toFixed(1)} ${Y(acc[acc.length-1-i]).toFixed(1)}`).join(' ');
    bands += `<path d="${up} ${dn} Z" fill="${s.color}" opacity=".9"/>`;
    acc = top;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img">${g}${bands}</svg>`;
}

/* =====================================================================
   SHARE — the card, and what may be on it.

   Deliberately a *drawn* card, not a screenshot of the panel. A DOM capture
   ships whatever happens to be on screen — an open tooltip, the row above,
   a reconciliation banner. A drawn card ships a declared field list and
   nothing else, which is the only version of this feature that is safe to
   put a marketing button on.

   The handle is typed by the user and stored locally. It is NOT derived from
   the account name, which is redacted everywhere else in this project; a
   handle that came from the account would put the identity back on the
   artefact through the side door.
   ===================================================================== */

/* ---------------------------------------------------------------------
   The Asteria mark. One geometry, two renderers.

   Copied from assets/logo/asteria-logo-light.svg, in the coordinate space
   of its translate(6,8) group, so the two cannot drift apart by hand. The
   ink rides currentColor and the star takes --brand-accent, which means
   there is no `theme === 'dark' ? a : b` anywhere and no second palette.

   The wordmark is set in the UI's own stack rather than rasterised from
   Inter Tight: a font that may not be installed is a cross-machine drift
   waiting to happen, and a share card must look the same on every machine
   that draws it. Below 24px the mark stands alone, per the brand note.
   --------------------------------------------------------------------- */
const MARK = {
  line:'M5 37 L15 27 L24 31 L33 19',
  dots:[[5,37],[15,27],[24,31]],
  star:'M35 4 C35.7 9.2 38.2 12.3 44 13 C38.2 13.7 35.7 16.8 35 22 C34.3 16.8 31.8 13.7 26 13 C31.8 12.3 34.3 9.2 35 4 Z',
  box:{x:2.2, y:4, w:41.8, h:35.8},
};

function markSVG(h=22){
  const s = h/MARK.box.h, w = MARK.box.w*s;
  return `<svg class="mark" width="${w.toFixed(1)}" height="${h}" viewBox="${MARK.box.x} ${MARK.box.y} ${MARK.box.w} ${MARK.box.h}" aria-hidden="true">
    <path d="${MARK.line}" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${MARK.dots.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.8" fill="currentColor"/>`).join('')}
    <path d="${MARK.star}" fill="var(--brand-accent)"/></svg>`;
}

function drawMark(c, x, y, h, ink, accent){
  const s = h/MARK.box.h;
  c.save(); c.translate(x, y); c.scale(s,s); c.translate(-MARK.box.x, -MARK.box.y);
  c.strokeStyle = ink; c.lineWidth = 3.2; c.lineCap='round'; c.lineJoin='round';
  c.stroke(new Path2D(MARK.line));
  c.fillStyle = ink;
  MARK.dots.forEach(([cx,cy])=>{ c.beginPath(); c.arc(cx,cy,2.8,0,Math.PI*2); c.fill(); });
  c.fillStyle = accent; c.fill(new Path2D(MARK.star));
  c.restore();
  return MARK.box.w*s;
}

const CARD_FIELDS = Object.freeze(['title','sub','value','pct','period','spark','name','provenance']);

const FORMATS = {
  post:     {w:1080, h:1080, label:'Vierkant 1:1'},
  portrait: {w:1080, h:1350, label:'Feed 4:5'},
  story:    {w:1080, h:1920, label:'Story 9:16'},
  wide:     {w:1200, h:675,  label:'Link 16:9'},
};

/* The account, as the sync already has it: fixtures/client.json → data.username
   and data.firstContact. Nothing is typed, so a card cannot be used to claim
   someone else's returns, and it cannot be blank or misspelled.

   Two things this does NOT do, stated here because a reader will assume both.

   It is not verification. Any value this extension can print, anyone holding
   the extension can also patch — the same reason src/lib/snapshot.js refuses to
   call the card "certified". A username from the account is exactly as
   unprovable to a viewer as one that was typed in.

   And `username` is a login name. It is one half of the credential pair, it is
   not designed to be public the way a social handle is, and DEGIRO does not
   hand out a new one. Publishing it invites credential stuffing against that
   specific account and targeted phishing that can quote it back. The owner has
   weighed that and chosen to offer it; the option therefore carries a warning
   in the sheet, and `first` stays the default. */
const ACCOUNT = {
  username:  'mvdpijl',
  firstName: 'Mathijs',
  lastName:  'van der Pijl',
};

const IDENTITY = {
  off:      {label:'Geen naam',      text:() => null},
  first:    {label:'Voornaam',       text:() => ACCOUNT.firstName},
  username: {label:'Gebruikersnaam', text:() => '@' + ACCOUNT.username},

const share = {
  open:false, spec:null,
  format:'post', theme:'light', amounts:!MASKED,
  /* Default off. The name on a DEGIRO account is a legal name, and a legal name
     on a public image is a heavier default than a hidden amount. */

};

function provenanceLine(p){
  const bits = [p.broker, p.asOf];
  bits.push(p.reconciled===true ? 'sluit tot op de cent op DEGIRO'
          : p.reconciled===false ? 'SLUIT NIET op DEGIRO' : 'niet getoetst');
  bits.push('v'+p.version);
  return bits.join(' · ');
}

/** Downsample to a shape. No axis, no scale: the spark discloses the path
 *  and never a level, which is why it survives amounts being hidden. */
function spark(series, max=56){
  const xs = series.filter(Number.isFinite);
  if (xs.length <= max) return xs;
  const stride = (xs.length-1)/(max-1);
  return Array.from({length:max},(_,i)=>xs[Math.round(i*stride)]);
}

/* Brand ink and brand accent are the logo's own two values and stay separate
   from the UI accent on purpose: white on #D9531E measures 4.03:1, under the
   4.5:1 floor, where the UI accent measures 4.87:1 — and that one is a filled
   button background. The star is decoration, so it may carry the brand value. */
const CARD_THEME = {
  light:{bg:'#FBFAF8', card:'#FFFFFF', ink:'#14181D', ink2:'#5C6672', ink3:'#939CA7', line:'#E9E6E0',
         pos:'#1668C4', neg:'#C0303D', accent:'#B8532F', brandInk:'#16213E', brandAccent:'#D9531E'},
  dark: {bg:'#0D1116', card:'#141920', ink:'#E8EDF3', ink2:'#98A3B0', ink3:'#6B7683', line:'#232B35',
         pos:'#5FA3F0', neg:'#EF737E', accent:'#E08355', brandInk:'#E8EDF5', brandAccent:'#F97038'},
};

function drawCard(spec, fmt, theme, opts){
  const F = FORMATS[fmt], T = CARD_THEME[theme];
  const cv = document.createElement('canvas');
  cv.width = F.w; cv.height = F.h;
  const c = cv.getContext('2d');
  const S = F.w/1080;
  const FT = (px,w=500) => `${w} ${px*S}px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif`;

  /* A 16:9 link card is 675px tall where the square is 1080. The stack that
     fits one does not fit the other, so the wide format is a two-column layout
     rather than the same column squeezed — which is also what a link preview
     actually looks like. */
  const wide = F.w > F.h;
  const P    = (wide ? 72 : 88) * S;
  const footH = (wide ? 120 : 150) * S;
  const footTop = F.h - footH;

  c.fillStyle = T.bg; c.fillRect(0,0,F.w,F.h);

  /* The lockup, drawn from the mark's own geometry rather than loaded from a
     file: an SVG through drawImage does not inherit currentColor and cannot be
     reached by the page's CSS, so a file-based watermark would have to pick a
     variant in JavaScript — the one thing the brand note forbids. */
  const mh = 52*S;
  const mw = drawMark(c, P, P, mh, T.brandInk, T.brandAccent);
  c.fillStyle = T.brandInk; c.font = `500 ${34*S}px ui-sans-serif, system-ui, sans-serif`;
  c.letterSpacing = `${3*S}px`;
  c.fillText('ASTERIA', P+mw+20*S, P+mh-6*S);
  c.letterSpacing = '0px';

  let y = P + mh;
  if (!wide){                                    // the period sits under the lockup
    c.fillStyle = T.ink3; c.font = FT(24,450);   // when there is room, in the footer when not
    c.fillText(spec.period, P, y + 40*S);
    y += 116*S;
  } else {
    y += 84*S;
  }

  const colW = wide ? (F.w-2*P)*0.54 : (F.w-2*P);

  c.fillStyle = T.ink3; c.font = FT(24,600);
  c.letterSpacing = `${1.6*S}px`;
  c.fillText(clipText(c, spec.title.toUpperCase(), colW), P, y);
  c.letterSpacing = '0px';
  y += (wide ? 84 : 96)*S;

  const hidden = !(opts.amounts || spec.value==null);
  const big = hidden ? `€ ${DOTS}` : spec.value;
  if (big){
    c.fillStyle = spec.valueColor ? T[spec.valueColor] : T.ink;
    const base = hidden ? 86 : (spec.value.length>13 ? 92 : 110);
    c.font = FT(wide ? base*0.86 : base, 640);
    c.fillText(big, P, y);
    y += (wide ? 46 : 54)*S;
  }

  if (spec.pct != null){
    const t = pct(spec.pct);
    c.font = FT((wide?46:52),620);
    const wpx = c.measureText(t).width;
    c.fillStyle = spec.pct<0 ? T.neg : T.pos;
    c.fillText(t, P, y+(wide?42:46)*S);
    if (spec.pctNote){
      c.fillStyle = T.ink2; c.font = FT(wide?27:30,450);
      c.fillText(clipText(c, spec.pctNote, colW-wpx-18*S), P+wpx+18*S, y+(wide?42:46)*S);
    }
    y += (wide ? 78 : 92)*S;
  }
  const subText = hidden ? (spec.subHidden || '') : spec.sub;
  if (subText){
    c.fillStyle = T.ink2; c.font = FT(wide?27:30,450);
    c.fillText(clipText(c, subText, colW), P, y+(wide?30:34)*S);
    y += (wide ? 62 : 72)*S;
  }

  /* The shape. No axis and no scale: it discloses the path and never a level,
     which is why it survives with the amounts hidden. */
  const sp = spec.spark || [];
  let cx0, cx1, cy0, cy1;
  if (wide){
    cx0 = P + colW + 44*S; cx1 = F.w - P;
    cy0 = P + mh + 40*S;   cy1 = footTop - 34*S;
  } else {
    cx0 = P; cx1 = F.w - P;
    cy0 = Math.min(y + 30*S, footTop - 170*S);
    cy1 = footTop - 60*S;
  }
  const ch = Math.max(90*S, cy1-cy0);
  if (sp.length > 1){
    const lo = Math.min(...sp), hi = Math.max(...sp), span = hi-lo || 1;
    const x  = i => cx0 + i*(cx1-cx0)/(sp.length-1);
    const yy = v => cy0 + ch - ((v-lo)/span)*ch;
    const col = sp[sp.length-1] >= sp[0] ? T.pos : T.neg;
    c.beginPath(); c.moveTo(x(0), yy(sp[0]));
    sp.forEach((v,i)=> c.lineTo(x(i), yy(v)));
    c.lineTo(x(sp.length-1), cy0+ch); c.lineTo(x(0), cy0+ch); c.closePath();
    const grad = c.createLinearGradient(0,cy0,0,cy0+ch);
    grad.addColorStop(0, col+'44'); grad.addColorStop(1, col+'00');
    c.fillStyle = grad; c.fill();
    c.beginPath(); sp.forEach((v,i)=> i?c.lineTo(x(i),yy(v)):c.moveTo(x(i),yy(v)));
    c.strokeStyle = col; c.lineWidth = 7*S; c.stroke();
  }

  /* Foot: who, and where it came from. */
  c.strokeStyle = T.line; c.lineWidth = 2*S;
  c.beginPath(); c.moveTo(P, footTop); c.lineTo(F.w-P, footTop); c.stroke();

  const name = opts.name;
  if (name){
    c.fillStyle = T.ink; c.font = FT(32,620);
    c.fillText(clipText(c, name, (F.w-2*P)*0.6), P, footTop + 48*S);
  }
  c.fillStyle = T.ink3; c.font = FT(wide?20:23,450);
  const prov = wide ? `${spec.period} · ${spec.provenance}` : spec.provenance;
  c.fillText(clipText(c, prov, F.w-2*P), P, footTop + (name ? 88*S : 48*S));

  if (hidden){
    c.fillStyle = T.ink3; c.font = FT(23,450);
    const t = 'bedragen verborgen';
    c.fillText(t, F.w-P-c.measureText(t).width, footTop + 48*S);
  }
  return cv;
}

/** Trim to fit. A long instrument name must not run off the card. */
function clipText(c, text, max){
  let t = String(text ?? '');
  if (c.measureText(t).width <= max) return t;
  while (t.length > 1 && c.measureText(t+'…').width > max) t = t.slice(0,-1);
  return t+'…';
}

    sub:'netto ontvangen in deze periode', period:per,
    spark:spark(slc(DIVM)), provenance:prov };
  if (key.startsWith('pos:')){

    const v0 = se[0], v1 = se[se.length-1];

  return null;
}

/* One element, one set of listeners.
   The first version re-attached the modal's handlers on every renderShare(),
   so after three format changes a single click ran four handlers, each of which
   re-rendered and attached a fifth. The regression sweep caught it as a hang.
   Listeners are bound once at create time and delegated, so the body can be
   replaced as often as it likes. */
let shareEl = null;

function ensureShareEl(){
  if (shareEl) return shareEl;
  shareEl = document.createElement('div');
  shareEl.id = 'share-modal';
  shareEl.className = 'modal-back';

  shareEl.addEventListener('click', e => {
    if (e.target === shareEl || e.target.closest('[data-x]')) { closeShare(); return; }
    const f = e.target.closest('#fmt-seg button');
    if (f) { share.format = f.dataset.f; return renderShare(); }
    const t = e.target.closest('#cardtheme-seg button');
    if (t) { share.theme = t.dataset.t; return renderShare(); }
    const i = e.target.closest('#ident-seg button');
    if (i) { share.identity = i.dataset.i; localStorage.setItem('ph-identity', share.identity); return renderShare(); }
    if (e.target.closest('#dl')) return download();
    if (e.target.closest('#cp')) return copy();
  });

  shareEl.addEventListener('change', e => {
    if (e.target.id === 'amt') { share.amounts = e.target.checked; renderShare(); }
  });

  document.body.appendChild(shareEl);
  return shareEl;
}

function closeShare(){
  share.open = false;
  if (shareEl) { shareEl.remove(); shareEl = null; }
}

function paintCard(){
  const host = shareEl && shareEl.querySelector('#share-canvas');
  if (!host) return;
  const cv = drawCard(share.spec, share.format, share.theme, cardOpts());
  host.width = cv.width; host.height = cv.height;
  host.getContext('2d').drawImage(cv, 0, 0);
  host.style.aspectRatio = `${cv.width}/${cv.height}`;
}

function download(){
  const cv = drawCard(share.spec, share.format, share.theme, cardOpts());
  const a = document.createElement('a');
  a.download = `asteria-${share.format}.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
}

async function copy(){
  const note = shareEl.querySelector('#cp-note');
  try {
    const cv = drawCard(share.spec, share.format, share.theme, cardOpts());
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    note.textContent = 'Op het klembord.';
  } catch {
    note.textContent = 'Klembord geweigerd door de browser — gebruik downloaden.';
  }
}

  document.getElementById('nav').innerHTML = PAGES.map(p=>`
    <button class="nav-item" type="button" data-id="${p.id}" aria-current="${p.id===current}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[p.id]}</svg>
      ${p.title}${p.tail?`<span class="tail">${p.tail}</span>`:''}</button>`).join('');
}

function render(){
  const p = PAGES.find(x=>x.id===current);
  document.getElementById('page-title').textContent = p.title;
  document.getElementById('range-seg').hidden = !RANGE_PAGES.has(current);
  [...document.getElementById('range-seg').children].forEach(x=>
    x.setAttribute('aria-pressed', String(!ZOOM && x.dataset.r===RANGE)));
  const eye = document.getElementById('mask-btn');
  eye.setAttribute('aria-pressed', String(MASKED));
  eye.title = MASKED ? 'Bedragen zijn verborgen \u2014 klik om ze te tonen'
                     : 'Verberg de bedragen; percentages blijven staan';
  document.getElementById('page-crumb').textContent =
    RANGE_PAGES.has(current) ? windowLabel() : current==='vooruitblik' ? 'geen meting' : 'hele historie';
  CHARTS.length = 0;
  document.getElementById('page').innerHTML = p.render();
  renderNav(); drawCharts(); scrollTo({top:0});
}

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('.nav-item'); if(!b) return; current=b.dataset.id; render();
});
/* Dragging a window out of the chart.
   Pointer events, so it works with a mouse, a trackpad and a touchscreen from
   one code path. A drag shorter than 8px is a click, not a selection. */
(function brush(){
  let host=null, x0=0, box=null, off=0;
  const rect = () => host.getBoundingClientRect();

  document.getElementById('page').addEventListener('pointerdown', e=>{
    const wrap = e.target.closest('.brush'); if(!wrap) return;
    host = wrap.querySelector('.chart-host'); if(!host) return;
    off = +wrap.dataset.off; x0 = e.clientX - rect().left;
    box = document.createElement('div'); box.className='brush-box';
    box.style.left = x0+'px'; box.style.width='0px';
    host.style.position='relative'; host.appendChild(box);
    host.setPointerCapture(e.pointerId);
  });

  document.addEventListener('pointermove', e=>{
    if(!box) return;
    const x = e.clientX - rect().left;
    box.style.left  = Math.min(x0,x)+'px';
    box.style.width = Math.abs(x-x0)+'px';
  });

  document.addEventListener('pointerup', e=>{
    if(!box) return;
    const x = e.clientX - rect().left, W = rect().width;
    const drag = Math.abs(x-x0);
    box.remove(); box=null;
    if (drag < 8) return;                      // a click, not a selection
    const PL = MASKED ? 18 : 64, PR = 16;
    const n  = sl(LBL).length - (Math.max(win().a,1) - win().a);
    const toI = px => Math.round(((px-PL)/(W-PL-PR)) * (n-1));
    let i0 = Math.max(0, Math.min(n-1, toI(Math.min(x0,x))));
    let i1 = Math.max(0, Math.min(n-1, toI(Math.max(x0,x))));
    if (i1 - i0 < 2) return;                   // fewer than three points draws nothing
    ZOOM = {a: off+i0, b: off+i1};
    render();
  });
})();

/* Month picking. Delegated, because the matrix is rebuilt on every render. */
document.getElementById('page').addEventListener('click', e=>{
  const cell = e.target.closest('td.pick');
  if (cell){ SEL.has(cell.dataset.m) ? SEL.delete(cell.dataset.m) : SEL.add(cell.dataset.m); render(); return; }
  const col = e.target.closest('th.pick-col');
  if (col){
    const m = col.dataset.col.padStart(2,'0');
    const keys = Object.keys(MONTHS).map(y=>`${y}-${m}`).filter(k=>{
      const [y,mm]=k.split('-'); return (MONTHS[y]||[])[+mm-1]!=null; });
    const allOn = keys.every(k=>SEL.has(k));
    keys.forEach(k=> allOn ? SEL.delete(k) : SEL.add(k));
    render(); return;
  }
  if (e.target.closest('#clear-sel')){ SEL.clear(); render(); return; }
  if (e.target.closest('#zoom-reset')){ ZOOM = null; render(); }
});
document.getElementById('page').addEventListener('keydown', e=>{
  if (e.key!=='Enter' && e.key!==' ') return;
  const t = e.target.closest('td.pick, th.pick-col');
  if (t){ e.preventDefault(); t.click(); }
});

document.getElementById('mask-btn').addEventListener('click', ()=>{
  MASKED = !MASKED;
  localStorage.setItem('ph-masked', MASKED ? '1' : '0');
  /* The card follows the page: if the amounts are hidden here, then hidden is
     also the right default for something you are about to post publicly. */
  share.amounts = !MASKED;
  render(); if (share.open) renderShare();
});
document.getElementById('range-seg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  RANGE = b.dataset.r; ZOOM = null;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  render();
});
document.addEventListener('click', e=>{
  const b = e.target.closest('.seg button');
  if (b && !b.closest('#range-seg') && !b.closest('.modal'))
    [...b.parentElement.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
});

const moreBtn=document.getElementById('more-btn'), moreMenu=document.getElementById('more-menu');
moreBtn.addEventListener('click', e=>{ e.stopPropagation(); moreMenu.hidden=!moreMenu.hidden; moreBtn.setAttribute('aria-expanded',String(!moreMenu.hidden)); });
document.addEventListener('click', ()=>{ moreMenu.hidden=true; moreBtn.setAttribute('aria-expanded','false'); });
moreMenu.addEventListener('click', e=>e.stopPropagation());
document.getElementById('theme-seg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.documentElement.dataset.theme=b.dataset.theme;
  share.theme = b.dataset.theme; if (share.open) renderShare();
});

document.getElementById('lockup').innerHTML = markSVG(20) + '<span class="wordmark">ASTERIA</span>';

render();
</script>
