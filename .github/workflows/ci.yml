# npm test on every push and pull request to main. The suite has no
# dependencies to install: node --test over test/, plus the leak, palette,
# type and backlog checks that `npm test` already chains in front of it.
#
# Every action is pinned to a commit SHA, tag in the comment (US-141, finding 13).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The names list never enters the repo (a committed list of names is the
      # leak it guards against). It comes from a secret, one name per line.
      - name: Write .leakwords from the LEAKWORDS secret
        env:
          LEAKWORDS: ${{ secrets.LEAKWORDS }}
        run: |
          if [ -z "$LEAKWORDS" ]; then
            echo "::error::Repository secret LEAKWORDS is not set; tools/check-leaks.mjs cannot check names. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$LEAKWORDS" > .leakwords
      - run: npm test
