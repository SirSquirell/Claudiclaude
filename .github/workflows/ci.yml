# npm test on every push and pull request to main. The suite has no
# dependencies to install: node --test over test/, plus the leak, palette,
# type and backlog checks that `npm test` already chains in front of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
